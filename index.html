<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dream-bg">
        <div class="stars"></div>
        <div class="floating-orbs">
            <div class="orb orb1"></div>
            <div class="orb orb2"></div>
            <div class="orb orb3"></div>
        </div>
    </div>
    <main class="main-container">
        <div class="content-wrapper">
            <div id="welcome-section">
                <div class="loading-animation" id="loadingAnimation">
                    <div class="spinner"></div>
                    <h1>Welcome to the Dreams Section</h1>
                    <p>Loading your dream portal...</p>
                </div>
                <div class="main-content hidden" id="mainContent">
                    <div class="dream-icon">✨</div>
                    <h1>Dream Portal</h1>
                    <p>Explore your dream journey</p>
                    <div class="dream-stats">
                        <div class="stat-item">
                            <span class="stat-number">10</span>
                            <span class="stat-label">Dreams</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">7</span>
                            <span class="stat-label">Days</span>
                        </div>
                    </div>
                    <div class="button-container">
                        <button id="dreamButton" class="hidden">My Dreams</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
